name: Verify editor navigation and save lifecycle
on:
  push:
    branches: ['codex/editor-navigation-*']
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Full regression or focused navigation and persistence rerun'
        type: choice
        options: [full, flows, lifecycle, sharing, export-picker]
        default: full
permissions:
  contents: read
jobs:
  verify:
    name: Editor flows (${{ matrix.device }}, ${{ matrix.scope }})
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LAYOUT_DERIVED_DIR: artifacts/editor-derivedData
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test_scope == 'export-picker' && '[{"device":"iphone","scope":"export-picker"},{"device":"mini","scope":"export-picker"}]' || inputs.test_scope == 'sharing' && '[{"device":"iphone","scope":"editor-sharing"}]' || inputs.test_scope == 'lifecycle' && '[{"device":"iphone","scope":"editor-lifecycle"},{"device":"mini","scope":"editor-lifecycle"}]' || inputs.test_scope == 'flows' && '[{"device":"iphone","scope":"editor-flows"},{"device":"mini","scope":"editor-flows"}]' || '[{"device":"iphone","scope":"editor-navigation"},{"device":"iphone","scope":"editor-layout"},{"device":"iphone","scope":"editor-editing"},{"device":"mini","scope":"editor-tablet"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Capture all return controls first
        if: ${{ inputs.test_scope == 'flows' }}
        env:
          LAYOUT_DEVICE: ${{ matrix.device }}
          LAYOUT_SCOPE: editor-preview
          LAYOUT_OUTPUT_DIR: artifacts/editor-preview
        run: bash scripts/validate-layout-on-macos.sh
      - name: Export early return screenshots
        if: ${{ always() && inputs.test_scope == 'flows' }}
        run: |
          if [[ -d artifacts/editor-preview/tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path artifacts/editor-preview/tests.xcresult > artifacts/editor-preview/summary.json
            xcrun xcresulttool export attachments --path artifacts/editor-preview/tests.xcresult --output-path artifacts/editor-preview/attachments
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.test_scope == 'flows' }}
        with:
          name: editor-build21-${{ matrix.device }}-editor-preview-${{ github.run_attempt }}
          path: |
            artifacts/editor-preview/*.log
            artifacts/editor-preview/*.json
            artifacts/editor-preview/attachments/**
            !artifacts/editor-preview/attachments/**/*.mp4
          retention-days: 14
      - name: Build and verify native editor flows
        if: ${{ !cancelled() }}
        env:
          LAYOUT_DEVICE: ${{ matrix.device }}
          LAYOUT_SCOPE: ${{ matrix.scope }}
          LAYOUT_BUILD_ACTION: ${{ inputs.test_scope == 'flows' && 'test-without-building' || 'test' }}
        run: bash scripts/validate-layout-on-macos.sh
      - name: Export results and screenshots
        if: always()
        run: |
          if [[ -d artifacts/ipad-layout/tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path artifacts/ipad-layout/tests.xcresult > artifacts/ipad-layout/summary.json
            xcrun xcresulttool export attachments --path artifacts/ipad-layout/tests.xcresult --output-path artifacts/ipad-layout/attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-build21-${{ matrix.device }}-${{ matrix.scope }}-${{ github.run_attempt }}
          path: |
            artifacts/ipad-layout/*.log
            artifacts/ipad-layout/*.json
            artifacts/ipad-layout/attachments/**
            !artifacts/ipad-layout/attachments/**/*.mp4
          retention-days: 14
