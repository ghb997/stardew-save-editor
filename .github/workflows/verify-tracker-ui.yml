name: Verify Tracker native UI

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/tracker-ui-*'

permissions:
  contents: read

concurrency:
  group: tracker-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tracker:
    name: Debug simulator tests and Tracker screenshots
    runs-on: macos-15
    timeout-minutes: 50
    env:
      VALIDATION_OUTPUT_DIR: ${{ github.workspace }}/artifacts/tracker-verification/tests
      TRACKER_UI_OUTPUT_DIR: ${{ github.workspace }}/artifacts/tracker-verification/screenshots
      CAPTURE_WAIT_SECONDS: '8'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select installed Xcode 16.4 or another installed 16.x
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tracker-verification
          python3 - <<'PY' | tee artifacts/tracker-verification/xcode-selection.log
          import glob
          import os
          import re
          import subprocess

          candidates = []
          for app in sorted(glob.glob('/Applications/Xcode*.app')):
              developer = app + '/Contents/Developer'
              executable = developer + '/usr/bin/xcodebuild'
              if not os.path.isfile(executable):
                  continue
              result = subprocess.run([executable, '-version'], text=True, capture_output=True,
                                      env={**os.environ, 'DEVELOPER_DIR': developer})
              match = re.search(r'^Xcode (\d+(?:\.\d+)*)', result.stdout, re.MULTILINE)
              if result.returncode != 0 or not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split('.'))
              print(f'Installed: {app}: {match.group(1)}', flush=True)
              if version[0] == 16:
                  candidates.append((version[:2] == (16, 4), version, developer, match.group(1)))
          if not candidates:
              raise SystemExit('ERROR: No usable installed Xcode 16.x. No toolchain was installed automatically.')
          _, _, developer, version = sorted(candidates, reverse=True)[0]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'DEVELOPER_DIR={developer}\n')
              stream.write(f'EXPECTED_XCODE_VERSION={version}\n')
          print(f'Selected Xcode {version}: {developer}', flush=True)
          PY

      - name: Build and run the native simulator test suite
        id: tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-on-macos.sh 2>&1 | tee artifacts/tracker-verification/test-command.log

      - name: Export native test attachments from available result bundles
        id: test_attachments
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          attachment_result_count=0
          attachments_base='artifacts/tracker-verification/test-attachments'
          help_log='artifacts/tracker-verification/xcresult-attachments-help.log'
          shopt -s nullglob
          for test_result in "$VALIDATION_OUTPUT_DIR"/*/tests.xcresult; do
            [[ -d "$test_result" ]] || continue
            if (( attachment_result_count == 0 )); then
              # Confirm the selected Xcode 16 tool's official option spelling
              # on the macOS runner before attempting any attachment export.
              xcrun xcresulttool export attachments --help 2>&1 | tee "$help_log"
              grep -F -q -- '--path' "$help_log"
              grep -F -q -- '--output-path' "$help_log"
              mkdir -p "$attachments_base"
            fi
            attachment_result_count=$((attachment_result_count + 1))
            result_name="${test_result%/tests.xcresult}"
            result_name="${result_name##*/}"
            attachment_output="$(mktemp -d "$attachments_base/$result_name-XXXXXX")"
            printf 'Result bundle: %s\nExport directory: %s\n' "$test_result" "$attachment_output" | tee "$attachment_output/export.log"
            # No --only-failures: retain successful XCUITest screenshot
            # attachments and their manifest as well as failure evidence.
            xcrun xcresulttool export attachments \
              --path "$test_result" \
              --output-path "$attachment_output" 2>&1 | tee -a "$attachment_output/export.log"
          done
          shopt -u nullglob
          if (( attachment_result_count == 0 )); then
            printf 'SKIPPED: No tests.xcresult exists for this run; no test attachments were exported.\n' | tee artifacts/tracker-verification/test-attachments-export.log
            printf 'export_status=skipped-no-test-results\n' >> "$GITHUB_OUTPUT"
          else
            printf 'export_status=exported-%s-result-bundles\n' "$attachment_result_count" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Tracker overview, detail, appearance, and accessibility states
        id: screenshots
        # A failed test step remains a job failure but does not hide UI evidence.
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          # Reuse only this job's unique app after successful native tests.
          # The capture script still validates platform and all Debug hooks,
          # and always creates its own clean simulator for screenshots.
          unset APPPATH APP_PATH
          if [[ "$TEST_OUTCOME" == 'success' ]]; then
            tested_app_count=0
            tested_app_path=''
            shopt -s nullglob
            for candidate in "$VALIDATION_OUTPUT_DIR"/*/DerivedData/Build/Products/Debug-iphonesimulator/SheaflightAmberVault.app; do
              if [[ -d "$candidate" ]]; then
                tested_app_count=$((tested_app_count + 1))
                tested_app_path="$candidate"
              fi
            done
            shopt -u nullglob
            if (( tested_app_count == 1 )); then
              export APPPATH="$tested_app_path"
              printf 'Reusing this run\047s tested Debug app: %s\n' "$APPPATH"
            else
              printf 'No unique tested Debug app found; capture will build independently.\n'
            fi
          else
            printf 'Native tests did not succeed; capture will build independently.\n'
          fi
          bash scripts/capture-tracker-ui.sh 2>&1 | tee artifacts/tracker-verification/capture-command.log

      - name: Preserve compact native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-native-ui-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/tracker-verification/**/*.png
            artifacts/tracker-verification/**/*.log
            artifacts/tracker-verification/**/*.json
            artifacts/tracker-verification/**/*.tsv
            artifacts/tracker-verification/**/*.sha256
            artifacts/tracker-verification/**/xcode-version.txt
            artifacts/tracker-verification/**/bundle-id.txt
            artifacts/tracker-verification/**/app-path.txt
            artifacts/tracker-verification/**/temporary-simulator-udid.txt
            artifacts/tracker-verification/**/REVIEW_STATUS.txt
            artifacts/tracker-verification/**/*.xcresult/**
            !artifacts/tracker-verification/**/DerivedData/**
            !artifacts/tracker-verification/**/app-strings.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Report native verification outcomes
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ATTACHMENT_STATUS: ${{ steps.test_attachments.outputs.export_status || steps.test_attachments.outcome }}
          CAPTURE_OUTCOME: ${{ steps.screenshots.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' \
            '### Tracker native verification' \
            "Source commit: $SOURCE_COMMIT" \
            "Native build and test step: $TEST_OUTCOME" \
            "Test attachment export: $ATTACHMENT_STATUS" \
            "Native screenshot capture step: $CAPTURE_OUTCOME" \
            'A successful screenshot step means PNG files were captured, not that the UI passed visual review.' \
            'Review the screenshot artifact against validation/TRACKER_UI_CHECKLIST.md.' \
            'Failed tests remain a job failure even if screenshots are captured successfully.' \
            'Only synthetic Debug demo data is used by the capture script; no real game save is imported or written.' \
            'This workflow does not merge branches or publish a Release.' \
            >> "$GITHUB_STEP_SUMMARY"
