name: PelicanSaveEditor
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.3"
    CURRENT_PROJECT_VERSION: "8"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PelicanSaveEditor:
    type: application
    platform: iOS
    sources:
      - path: PelicanSaveEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.sheaflightambervault.v20260816f4c9
        PRODUCT_NAME: SheaflightAmberVault
        PRODUCT_MODULE_NAME: PelicanSaveEditor
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: PelicanSaveEditor/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PelicanSaveEditorTests
  PelicanSaveEditorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PelicanSaveEditorTests
    dependencies:
      - target: PelicanSaveEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.sheaflightambervault.v20260816f4c9.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SheaflightAmberVault.app/SheaflightAmberVault"
        BUNDLE_LOADER: "$(TEST_HOST)"
